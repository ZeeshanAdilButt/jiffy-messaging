apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiffy-messaging
  labels:
    app: jiffy-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jiffy-messaging
  template:
    metadata:
      labels:
        app: jiffy-messaging
    spec:
      containers:
        - name: jiffy-messaging
          image: jiffy-messaging:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jiffy-messaging-config
            - secretRef:
                name: jiffy-messaging-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /health never checks dependencies, so a slow or briefly down
          # database does not get this pod killed and restarted for no
          # reason. /ready does check the database, so a pod in that state
          # stops receiving traffic without being restarted.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
