apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiffy-messaging
  labels:
    app: jiffy-messaging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jiffy-messaging
  template:
    metadata:
      labels:
        app: jiffy-messaging
    spec:
      containers:
        - name: jiffy-messaging
          image: jiffy-messaging:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jiffy-messaging-config
            - secretRef:
                name: jiffy-messaging-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
